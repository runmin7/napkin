<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>단축키 설정</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/capture.css" />
    <link rel="stylesheet" href="css/settings.css" />
  </head>
  <body>
    <div class="pane">
      <div class="pane-body">
        <div class="group-label">기본 단축키</div>

        <div class="field">
          <div class="field-label">창 보이기 / 숨기기</div>
          <button type="button" class="keyslot" data-key="toggleWindow">
            <span class="value"></span><span class="change">클릭 후 키 입력</span>
          </button>
        </div>

        <div class="group-label">메모별 단축키</div>
        <div id="note-shortcuts"></div>
      </div>

      <div id="message" class="message" hidden></div>

      <div class="pane-foot">
        <p class="hint">Ctrl · Alt · Shift를 섞은 조합만 등록됩니다.</p>
        <span class="spacer"></span>
        <button type="button" id="close">닫기</button>
        <button type="button" id="save" class="primary">저장</button>
      </div>
    </div>
    <script src="bundle/settings.js"></script>
  </body>
</html>
